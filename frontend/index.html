<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Wall-E</title>
    <style>
        /* Fondo espacial usando gradientes y estrellas generadas por CSS (DISEÑO ORIGINAL RESTAURADO) */
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            background-color: #020611;
            /* Simulación de nebulosa azul profunda */
            background-image: 
                radial-gradient(circle at 50% 80%, rgba(0, 163, 224, 0.15), transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(14, 42, 71, 0.4), transparent 50%),
                /* Capa de estrellas lejanas */
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 100% 100%, 100% 100%, 550px 550px, 350px 350px, 250px 250px;
            background-repeat: no-repeat, no-repeat, repeat, repeat, repeat;
            background-attachment: fixed;
        }

        /* Contenedor del Logo de la U */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .logo-container img {
            width: 150px;
            height: auto;
            /* Sutil brillo azul detrás del logo para integrarlo a la galaxia */
            filter: drop-shadow(0 0 15px rgba(0, 163, 224, 0.4));
        }

        h1 { 
            color: #E2E8F0; 
            text-align: center; 
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
            margin-top: 5px;
        }

        /* Panel de Control de Filtros */
        .filter-panel {
            max-width: 100%;
            margin: 20px auto;
            background-color: #111823;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #233145;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 10px 15px;
            background-color: #070b12;
            border: 1px solid #333F51;
            border-radius: 5px;
            color: #E2E8F0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            border-color: #B36230;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background-color: #161D26;
            color: #A0AEC0;
            border: 1px solid #333F51;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-filter:hover {
            background-color: #233145;
            color: #E2E8F0;
        }

        .btn-filter.active {
            background-color: #B36230;
            color: white;
            border-color: #B36230;
            box-shadow: 0 0 10px rgba(179, 98, 48, 0.4);
        }

        /* Tabla con fondo plano mineral para que resalte sobre la galaxia */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            background-color: #161D26; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td { 
            padding: 12px; 
            border: 1px solid #333F51; 
            text-align: left; 
        }

        th { 
            background-color: #B36230; 
            color: #E2E8F0; 
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        td {
            color: #E2E8F0;
        }

        /* Cebreado plano compatible con WALL-E */
        tr:nth-child(odd) { 
            background-color: #0F1622; 
        }

        tr:nth-child(even) { 
            background-color: #161D26; 
        }

        .estado-planta { color: #52D078; font-weight: bold; }
        .estado-alerta { color: #F06A38; font-weight: bold; }
        .estado-eva { color: #63B3ED; }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="../LogoUni.png" alt="Logo Universidad">
    </div>

    <h1>Bitácora de Eventos - Wall-E</h1>
    
    <div class="filter-panel">
        <input type="text" id="search-input" class="search-box" placeholder="Buscar acción en tiempo real...">
        <div class="filter-buttons">
            <button class="btn-filter active" onclick="cambiarFiltro('todos', this)">Todos</button>
            <button class="btn-filter" onclick="cambiarFiltro('Planta', this)">Plantas 🌱</button>
            <button class="btn-filter" onclick="cambiarFiltro('Alerta', this)">Alertas/Directivas ⚠️</button>
            <button class="btn-filter" onclick="cambiarFiltro('Eva', this)">Eva 🤖</button>
        </div>
    </div>

    <div style="display: flex; gap: 15px; margin-bottom: 20px;">
        <div style="flex: 1; background: rgba(22, 29, 38, 0.7); border: 1px solid #233145; padding: 15px; border-radius: 8px; text-align: center; backdrop-filter: blur(5px);">
            <div style="color: #A0AEC0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Logs Visualizados</div>
            <div id="stat-total" style="color: #63B3ED; font-size: 24px; font-weight: bold; margin-top: 5px;">0</div>
        </div>
        <div style="flex: 1; background: rgba(22, 29, 38, 0.7); border: 1px solid #233145; padding: 15px; border-radius: 8px; text-align: center; backdrop-filter: blur(5px);">
            <div style="color: #A0AEC0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Eventos Críticos</div>
            <div id="stat-alertas" style="color: #E53E3E; font-size: 24px; font-weight: bold; margin-top: 5px;">0</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 25%;">Fecha y Hora</th>
                <th>Acción Registrada</th>
            </tr>
        </thead>
        <tbody id="tabla-logs">
        </tbody>
    </table>

    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 100%; margin: 20px auto; padding: 12px 15px; background-color: rgba(22, 29, 38, 0.8); border: 1px solid #333F51; border-radius: 8px; color: #A0AEC0; font-size: 13px; backdrop-filter: blur(5px);">
        <div>
            <strong>Bitácora de Eventos Wall-E</strong> | UMG 2026<br>
            <span style="color: #E2E8F0;">Desarrolladores: Javier Vela, Kabt´zin Velasco, Kevin Gabriel, Wendy Tomas (Sección B)</span>
        </div>
        <div style="font-size: 11px; text-align: right; color: #63B3ED;">
            Servidor de Monitoreo Activo 🚀
        </div>
    </div>

    <script>
        let logsLocales = [];
        let filtroActual = 'todos';

        function cargarLogs() {
            fetch('http://159.223.152.192:5000/api/logs')
                .then(response => response.json())
                .then(datos => {
                    logsLocales = datos; 
                    renderizarTabla();   
                })
                .catch(error => console.error('Error al cargar los logs:', error));
        }

        function renderizarTabla() {
            const tabla = document.getElementById('tabla-logs');
            const busqueda = document.getElementById('search-input').value.toLowerCase();
            
            tabla.innerHTML = ''; 
            
            let contadorTotal = 0;
            let contadorCriticos = 0;

            logsLocales.forEach(log => {
                const textoAccion = log.accion.toLowerCase();
                
                let pasaFiltroCategoria = false;
                if (filtroActual === 'todos') {
                    pasaFiltroCategoria = true;
                } else if (filtroActual === 'Planta' && log.accion.includes('Planta')) {
                    pasaFiltroCategoria = true;
                } else if (filtroActual === 'Alerta' && (log.accion.includes('Directiva') || log.accion.includes('A-113'))) {
                    pasaFiltroCategoria = true;
                } else if (filtroActual === 'Eva' && log.accion.includes('Eva')) {
                    pasaFiltroCategoria = true;
                }

                const pasaBusquedaTexto = textoAccion.includes(busqueda);

                if (pasaFiltroCategoria && pasaBusquedaTexto) {
                    contadorTotal++;
                    if (log.accion.includes('Directiva') || log.accion.includes('A-113') || log.accion.includes('Alerta')) {
                        contadorCriticos++;
                    }

                    let estiloEstado = '';
                    if(log.accion.includes('Planta')) estiloEstado = 'class="estado-planta"';
                    else if(log.accion.includes('Directiva') || log.accion.includes('A-113')) estiloEstado = 'class="estado-alerta"';
                    else if(log.accion.includes('Eva')) estiloEstado = 'class="estado-eva"';

                    const fila = `<tr>
                                    <td>${log.fecha_hora}</td>
                                    <td ${estiloEstado}>${log.accion}</td>
                                  </tr>`;
                    tabla.innerHTML += fila;
                }
            });

            document.getElementById('stat-total').innerText = contadorTotal;
            document.getElementById('stat-alertas').innerText = contadorCriticos;
        }

        document.getElementById('search-input').addEventListener('input', renderizarTabla);

        function cambiarFiltro(categoria, boton) {
            filtroActual = categoria;
            document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');
            renderizarTabla();
        }

        cargarLogs();
        setInterval(cargarLogs, 3000);
    </script>
</body>
</html>
